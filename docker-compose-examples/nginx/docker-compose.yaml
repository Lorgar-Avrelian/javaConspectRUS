services:
  nginx:
    image: nginx:stable
    container_name: nginx
    expose:
      - 8088
    ports:
      - "80:8088"
    restart: always
    volumes:
      - ./html:/usr/share/nginx/html
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./log:/log
    networks:
      - app-network

volumes:
  config:
  html:
  log:

networks:
  app-network:
    driver: bridge